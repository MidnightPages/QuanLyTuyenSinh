<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ học viên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>ĐĂNG KÝ KHÓA HỌC</h1>
    <h2>Trung tâm ABC</h2>
  </header>

  <main>
    <form id="profileForm" novalidate>
      <div class="field">
        <label for="fullname">Họ và tên</label>
        <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên" autocomplete="name">
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="dob">Ngày sinh</label>
        <input type="text" id="dob" name="dob" placeholder="dd/mm/yyy" autocomplete="bday">
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="phone">Số điện thoại</label>
        <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại liên hệ" autocomplete="tel">
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Nhập email liên hệ" autocomplete="email">
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="address">Địa chỉ</label>
        <input type="text" id="address" name="address" placeholder="Nhập địa chỉ liên hệ" autocomplete="street-address">
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="khoahoc">Khóa học</label>
        <select id="khoahoc" name="maDotKhoaHoc">
          <option value="">Đang tải danh sách khóa học...</option>
        </select>
        <small class="error" aria-live="polite"></small>
      </div>

      <button type="submit" class="submit">Gửi đăng ký</button>
      <p id="status" class="status" role="status"></p>
    </form>
  </main>

  <script src="main.js"></script>
</body>
</html>
